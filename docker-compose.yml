name: hire

services:
  bot:
    build:
      context: .
      dockerfile: Dockerfile.web
    restart: unless-stopped
    expose:
      - 3000
    ports:
      - "3000:3000"
    env_file:
      - path: .env
        required: false
    environment:
      HIRE_DB_PATH: /data/hire_bot.db
    volumes:
      - data:/data

  telegram:
    build:
      context: .
      dockerfile: Dockerfile.bot
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      HIRE_DB_PATH: /data/hire_bot.db
      CV_STORAGE_URL: sqlite:////data/cryptoverify_store.db
      CV_RECEIPT_DIR: /data/receipts
      ADMIN_WEB_URL: http://bot:3000
    volumes:
      - data:/data

volumes:
  data:
