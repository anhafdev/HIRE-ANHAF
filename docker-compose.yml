name: hire

services:
  bot:
    build:
      context: .
      dockerfile: Dockerfile.bot
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      HIRE_DB_PATH: /data/hire_bot.db
      CV_STORAGE_URL: sqlite:////data/cryptoverify_store.db
      CV_RECEIPT_DIR: /data/receipts
      ADMIN_WEB_URL: http://web:8000
    volumes:
      - data:/data

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - path: .env
        required: false
    environment:
      HIRE_DB_PATH: /data/hire_bot.db
    volumes:
      - data:/data

volumes:
  data:
